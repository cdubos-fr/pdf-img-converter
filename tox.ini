[tox]
requires =
    tox>=4
isolated_build = True
envlist = py313,typing,precommit

[testenv]
usedevelop = True
pdm_sync = True
pdm_lock = False
deps =
    pdm>=2.10.0

[testenv:typing]
dependency_groups = dev
commands =
    mypy --install-types {posargs} \
        -m=pdf_converter \
        --show-error-codes \
        --non-interactive

[testenv:precommit]
deps =
    pre-commit
commands =
    pre-commit run --all-files

[testenv:devenv]
basepython = py313
dependency_groups = dev
deps =
    commitizen
    virtualenv
    pre-commit
